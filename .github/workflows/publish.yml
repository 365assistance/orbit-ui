name: Publish @365assistance/orbit-ui

# Publishes to GitHub Packages when a version tag (v*) is pushed.
# Uses the built-in GITHUB_TOKEN (packages: write) — satisfies the org policy
# that forbids classic PATs, so no personal token is ever needed.
on:
  push:
    tags:
      - 'v*'
  # Manual trigger for a publish without tagging (e.g. re-run a failed publish).
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@365assistance'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build library
        run: npm run build

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
